<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>JOBFILL — My Profile</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page-bg"></div>
  <div class="container">
    <header class="dossier-header">
      <div class="header-copy">
        <div class="brand-row">
          <span class="brand-mark"><img src="autofill-logo.png" alt="" /></span>
          <div>
            <p class="eyebrow">Personal profile</p>
            <h1>My Dossier</h1>
          </div>
        </div>
        <p class="sub">Fill this once. It's stored on this device and used to complete applications automatically.</p>
      </div>
      <div class="header-actions">
        <div class="header-card">
          <span class="header-label">Storage</span>
          <strong>Saved locally in your browser</strong>
          <span class="header-meta">Private by default · No account needed</span>
        </div>
        <button id="saveBtn" class="save-btn" type="button">Save profile</button>
        <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
      </div>
    </header>

    <div class="dossier-layout">
      <nav class="section-rail" id="sectionRail" aria-label="Profile sections"></nav>
      <main class="section-page" id="sectionPage"></main>
    </div>
  </div>
  <script src="schema.js"></script>
  <script src="options.js"></script>
</body>
</html>
