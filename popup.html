<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <img src="autofill-logo.png" alt="Logo" class="logo" />
        <div>
          <p class="eyebrow">Job application helper</p>
          <h1>JOBFILL</h1>
        </div>
      </div>
      <p class="hero-copy">Autofill forms, learn new fields, and keep your profile ready for the next application.</p>
    </div>
    <div class="action-card">
      <button id="fillBtn" class="primary" aria-label="Autofill this page" title="Autofill this page">⚡ Autofill this page</button>
      <div id="status" class="status"></div>
      <button id="learnBtn" class="secondary learn" aria-label="Learn mappings from this form" title="Learn mappings from this form">📥 Learn from this form</button>
    </div>
    <div class="row">
      <button id="editProfileBtn" class="secondary" aria-label="Edit profile">Edit my profile</button>
      <button id="clearSiteBtn" class="link" aria-label="Forget mappings for this site">Forget mappings for this site</button>
    </div>
    <div class="tip-grid">
      <div class="tip-card">
        <span class="tip-kicker">Unmatched fields</span>
        <p>Use the "+" badge to map a field once and remember it for next time.</p>
      </div>
      <div class="tip-card">
        <span class="tip-kicker">Best results</span>
        <p>Keep your profile updated with your latest resume, phone, and links.</p>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
