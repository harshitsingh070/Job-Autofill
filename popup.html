<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <div class="stamp-mark" aria-hidden="true">JF</div>
        <div>
          <p class="eyebrow">Application desk</p>
          <h1>JOBFILL</h1>
        </div>
      </div>
      <p class="hero-copy">Fill applications, log new fields, and keep your dossier ready for the next form.</p>
    </div>
    <div class="action-card">
      <button id="fillBtn" class="primary" aria-label="Autofill this page" title="Autofill this page"><span class="btn-icon btn-icon--stamp">↯</span> Autofill this page</button>
      <div id="status" class="status"></div>
      <button id="learnBtn" class="secondary learn" aria-label="Learn mappings from this form" title="Learn mappings from this form"><span class="btn-icon btn-icon--ink">⌁</span> Learn from this form</button>
      <div class="note-block">
        <div class="note-label">Unmatched fields</div>
        <p>Use the stamp badge on the page to map a field once, then reuse it next time.</p>
      </div>
    </div>
    <div class="link-row">
      <button id="editProfileBtn" class="link" aria-label="Edit profile">Edit my profile</button>
      <button id="clearSiteBtn" class="link" aria-label="Forget mappings for this site">Forget mappings for this site</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
